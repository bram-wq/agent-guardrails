<svg xmlns="http://www.w3.org/2000/svg" width="900" height="508" viewBox="0 0 900 508" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
  <title>node demo.mjs — each guard fed the incident and its legitimate twin</title>
  <rect width="900" height="508" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M10 0 h880 a10 10 0 0 1 10 10 v30 H0 V10 a10 10 0 0 1 10 -10 z" fill="#161b22"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="6" fill="#27c93f"/>
  <text x="450" y="24" text-anchor="middle" fill="#8b949e" font-size="12">agent-guardrails — node demo.mjs</text>
  <text x="24" y="56" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9">node demo.mjs</tspan></text>
  <text x="24" y="76" xml:space="preserve"><tspan fill="#f0f6fc" font-weight="bold">runaway-guard</tspan></text>
  <text x="24" y="96" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#3fb950" font-weight="bold">✔</tspan><tspan fill="#8b949e"> must-fire      </tspan><tspan fill="#c9d1d9">&quot;yes for sure&quot;</tspan><tspan fill="#8b949e">                               → </tspan><tspan fill="#f85149" font-weight="bold">REFUSED</tspan><tspan fill="#8b949e"></tspan></text>
  <text x="24" y="116" xml:space="preserve"><tspan fill="#8b949e">      reason: Runaway output: `yes` prints forever until killed, and nothing in this command bounds it. A tw…</tspan></text>
  <text x="24" y="136" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#3fb950" font-weight="bold">✔</tspan><tspan fill="#8b949e"> must-not-fire  </tspan><tspan fill="#c9d1d9">&quot;yes | head -3&quot;</tspan><tspan fill="#8b949e">                              → </tspan><tspan fill="#3fb950" font-weight="bold">allowed</tspan><tspan fill="#8b949e"></tspan></text>
  <text x="24" y="156" xml:space="preserve"></text>
  <text x="24" y="176" xml:space="preserve"><tspan fill="#f0f6fc" font-weight="bold">prose-guard</tspan></text>
  <text x="24" y="196" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#3fb950" font-weight="bold">✔</tspan><tspan fill="#8b949e"> must-fire      </tspan><tspan fill="#c9d1d9">&quot;please run the tests again&quot;</tspan><tspan fill="#8b949e">                 → </tspan><tspan fill="#f85149" font-weight="bold">REFUSED</tspan><tspan fill="#8b949e"></tspan></text>
  <text x="24" y="216" xml:space="preserve"><tspan fill="#8b949e">      reason: Not a command: &quot;please&quot; is not a program, a builtin, or a file on disk — so this looks like a …</tspan></text>
  <text x="24" y="236" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#3fb950" font-weight="bold">✔</tspan><tspan fill="#8b949e"> must-not-fire  </tspan><tspan fill="#c9d1d9">&quot;npm test&quot;</tspan><tspan fill="#8b949e">                                   → </tspan><tspan fill="#3fb950" font-weight="bold">allowed</tspan><tspan fill="#8b949e"></tspan></text>
  <text x="24" y="256" xml:space="preserve"></text>
  <text x="24" y="276" xml:space="preserve"><tspan fill="#f0f6fc" font-weight="bold">piped-verdict-guard</tspan></text>
  <text x="24" y="296" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#3fb950" font-weight="bold">✔</tspan><tspan fill="#8b949e"> must-fire      </tspan><tspan fill="#c9d1d9">&quot;git push origin main 2&gt;&amp;1 | tail -2&quot;</tspan><tspan fill="#8b949e">        → </tspan><tspan fill="#f85149" font-weight="bold">REFUSED</tspan><tspan fill="#8b949e"></tspan></text>
  <text x="24" y="316" xml:space="preserve"><tspan fill="#8b949e">      reason: PIPED VERDICT: `git push` is piped into `tail`, so this command's exit code is tail's, not git…</tspan></text>
  <text x="24" y="336" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#3fb950" font-weight="bold">✔</tspan><tspan fill="#8b949e"> must-not-fire  </tspan><tspan fill="#c9d1d9">&quot;git push origin main&quot;</tspan><tspan fill="#8b949e">                       → </tspan><tspan fill="#3fb950" font-weight="bold">allowed</tspan><tspan fill="#8b949e"></tspan></text>
  <text x="24" y="356" xml:space="preserve"></text>
  <text x="24" y="376" xml:space="preserve"><tspan fill="#f0f6fc" font-weight="bold">piped-verdict-guard</tspan></text>
  <text x="24" y="396" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#3fb950" font-weight="bold">✔</tspan><tspan fill="#8b949e"> must-fire      </tspan><tspan fill="#c9d1d9">&quot;git merge --no-ff topic 2&gt;&amp;1 | tail -3&quot;</tspan><tspan fill="#8b949e">     → </tspan><tspan fill="#f85149" font-weight="bold">REFUSED</tspan><tspan fill="#8b949e"></tspan></text>
  <text x="24" y="416" xml:space="preserve"><tspan fill="#8b949e">      reason: PIPED VERDICT: `git merge` is piped into `tail`, so this command's exit code is tail's, not gi…</tspan></text>
  <text x="24" y="436" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#3fb950" font-weight="bold">✔</tspan><tspan fill="#8b949e"> must-not-fire  </tspan><tspan fill="#c9d1d9">&quot;npm test 2&gt;&amp;1 | tail -5&quot;</tspan><tspan fill="#8b949e">                    → </tspan><tspan fill="#3fb950" font-weight="bold">allowed</tspan><tspan fill="#8b949e"></tspan></text>
  <text x="24" y="456" xml:space="preserve"></text>
  <text x="24" y="476" xml:space="preserve"><tspan fill="#3fb950" font-weight="bold">Every guard fired where it must and stayed silent where it must not.</tspan></text>
</svg>
