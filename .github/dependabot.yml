# Keeps the SHA-pinned actions current. Every `uses:` is pinned to a full commit SHA with its release
# tag in a comment; Dependabot updates both together, so a pin never silently goes stale.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'
