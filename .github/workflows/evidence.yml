name: Adversarial evidence
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Evaluate the versioned corpus and source mutations
        run: node scripts/evaluate.mjs --out artifacts/evaluation
      - name: Exercise the packed package offline
        working-directory: artifacts/evaluation
        run: |
          node ../../scripts/package-smoke.mjs > package-smoke.json
          sha256sum package-smoke.json > package-smoke.sha256
      - name: Preserve the measured receipt, including failed evaluations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adversarial-evidence-${{ github.sha }}
          path: artifacts/evaluation/
          if-no-files-found: error
          retention-days: 30
