name: Trusted actual-host evidence
on:
  workflow_dispatch:
    inputs:
      host:
        type: choice
        options: [claude, codex]
        required: true

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse non-main execution
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
  host:
    needs: authorize
    runs-on: [self-hosted, agent-guardrails-host-proof]
    environment: host-validation
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Explain the single-use trust prerequisite
        run: echo 'This job requires a fresh, manually reviewed fixture for EACH dispatch. Reusing an earlier fixture is refused, not retried.' >> "$GITHUB_STEP_SUMMARY"
      - name: Run the reviewed single-use fixture
        env:
          HOST: ${{ inputs.host }}
          PROJECT: ${{ vars.HOST_PROOF_PROJECT }}
          HOST_PROOF_EXPECT_VERSION: ${{ vars.HOST_PROOF_EXPECT_VERSION }}
          RECEIPTS: ${{ runner.temp }}/host-proof-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -n "$PROJECT"
          node scripts/host-run.mjs run "$HOST" "$PROJECT" "$RECEIPTS"
      - name: Preserve the sanitized receipt, never raw host output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-evidence-${{ inputs.host }}-${{ github.sha }}
          path: ${{ runner.temp }}/host-proof-${{ github.run_id }}-${{ github.run_attempt }}/*
          if-no-files-found: error
          retention-days: 30
